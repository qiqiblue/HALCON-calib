name: Publish bot2_calib Conan dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conan-deps-20261019
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aarch22
            runner: ubuntu-22.04
          - profile: aarch24
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan-bundle-cache
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            conan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: python -m pip install conan==2.30.0
      - name: Configure anonymous upstreams
        run: |
          conan remote add tea-gitea https://pandatea.top:8890/api/packages/ai2/conan --index 0
          conan remote update conancenter --url https://center2.conan.io
      - name: Download, archive and verify offline restoration
        run: python conan/bundle.py export --profile '${{ matrix.profile }}' --output out
      - uses: actions/upload-artifact@v4
        with:
          name: conan-${{ matrix.profile }}
          path: |
            out/*.tgz
            out/*.manifest.json
            out/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            conan
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: conan-deps-20261019
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --title 'bot2_calib Conan dependencies: Ubuntu 22.04 / 24.04 arm64' \
            --notes-file conan/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" artifacts/*.tgz artifacts/*.manifest.json artifacts/*.sha256
          gh release edit "$RELEASE_TAG" --draft=false
